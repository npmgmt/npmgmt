<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>NPMGMT — Artist Management</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- BACKGROUND VIDEO -->

    <video
        class="background-video"
        autoplay
        muted
        loop
        playsinline
    >
        <source src="background.mp4" type="video/mp4">
    </video>

    <!-- DARK OVERLAY -->

    <div class="overlay"></div>


    <!-- MAIN CONTENT -->

    <main>

        <section class="content">

            <h1>NPMGMT</h1>

            <p class="subtitle">
                ARTIST MANAGEMENT
            </p>

            <p class="description">
                For management, booking and business inquiries.
            </p>


            <div class="inquiry-box">

                <h2>INQUIRY</h2>

                <form>

                    <input
                        type="text"
                        name="name"
                        placeholder="NAME"
                        required
                    >

                    <input
                        type="email"
                        name="email"
                        placeholder="EMAIL"
                        required
                    >

                    <input
                        type="text"
                        name="artist"
                        placeholder="ARTIST / COMPANY"
                    >

                    <textarea
                        name="message"
                        placeholder="YOUR MESSAGE"
                        required
                    ></textarea>

                    <button type="submit">
                        SEND INQUIRY →
                    </button>

                </form>

            </div>

        </section>

    </main>


    <!-- FOOTER -->

    <footer>
        info@npmgmt.de
    </footer>

</body>

</html>
