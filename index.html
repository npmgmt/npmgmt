<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>NPMGMT</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- BACKGROUND VIDEO -->

    <video
        class="background-video"
        autoplay
        muted
        loop
        playsinline
    >
        <source src="background.mp4" type="video/mp4">
    </video>

    <!-- DARK OVERLAY -->

    <div class="overlay"></div>


    <!-- MAIN CONTENT -->

    <main>

        <section class="content">

            <!-- BRAND -->

            <h1>NPMGMT</h1>

            <p class="artists">
                MIGO / NEEZ / PACKO / DVEE
            </p>


            <!-- DESCRIPTION -->

            <p class="description">
                For management, booking and business inquiries.
            </p>


            <!-- INQUIRY FORM -->

            <div class="inquiry-box">

                <h2>INQUIRY</h2>

                <form
                    action="https://api.web3forms.com/submit"
                    method="POST"
                >

                    <!-- WEB3FORMS ACCESS KEY -->

                    <input
                        type="hidden"
                        name="access_key"
                        value="164e62e8-943b-4273-bbd5-5fc50086ce58"
                    >

                    <!-- EMAIL SUBJECT -->

                    <input
                        type="hidden"
                        name="subject"
                        value="New NPMGMT Inquiry"
                    >

                    <!-- NAME -->

                    <input
                        type="text"
                        name="name"
                        placeholder="NAME"
                        required
                    >

                    <!-- EMAIL -->

                    <input
                        type="email"
                        name="email"
                        placeholder="EMAIL"
                        required
                    >

                    <!-- ARTIST / COMPANY -->

                    <input
                        type="text"
                        name="artist"
                        placeholder="ARTIST / COMPANY"
                    >

                    <!-- MESSAGE -->

                    <textarea
                        name="message"
                        placeholder="YOUR MESSAGE"
                        required
                    ></textarea>

                    <!-- SUBMIT -->

                    <button type="submit">
                        SEND INQUIRY →
                    </button>

                </form>

            </div>

        </section>

    </main>


    <!-- FOOTER -->

    <footer>
        info@npmgmt.de
    </footer>

</body>

</html>
